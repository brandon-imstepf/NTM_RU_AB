<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-label="One axon connecting two network nodes, each holding soluble and insoluble tau pools linked by fragmentation-aggregation, with release and uptake fluxes at both ends and the shooting parameter B solved so mass balances at x=L">
  <title>NTM_RU: release and uptake at a network edge</title>
  <rect x="0" y="0" width="1000" height="610" fill="#fcfcfb"/>

  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a7a40"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b5342f"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- Context line (no title) -->
  <text x="500" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c5c5c">One axon per connected region-pair (j &#8594; i); every edge in the connectome has this structure</text>

  <!-- Mini network context, top right -->
  <rect x="800" y="42" width="170" height="118" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="885" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#2a78d6">zoomed below &#8595;</text>
  <line x1="820" y1="86" x2="850" y2="78" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="820" y1="86" x2="882" y2="98" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="850" y1="78" x2="882" y2="98" stroke="#2a78d6" stroke-width="2.5"/>
  <line x1="882" y1="98" x2="918" y2="80" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="918" y1="80" x2="948" y2="106" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="820" cy="86" r="5" fill="#0b0b0b"/>
  <circle cx="850" cy="78" r="5" fill="#0b0b0b"/>
  <circle cx="882" cy="98" r="5" fill="#0b0b0b"/>
  <circle cx="918" cy="80" r="5" fill="#0b0b0b"/>
  <circle cx="948" cy="106" r="5" fill="#0b0b0b"/>
  <text x="885" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6b6b6b">one edge of</text>
  <text x="885" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6b6b6b">the connectome</text>

  <!-- Node j: holds soluble N_j and insoluble M_j, linked by fragmentation/aggregation Gamma -->
  <circle cx="105" cy="300" r="60" fill="#eaf1fb" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="105" y="289" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">node j</text>
  <text x="105" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0b0b0b">N_j (&#915;) M_j</text>
  <text x="105" y="372" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b6b6b">M_j = g(N_j)</text>
  <text x="105" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">source / soma pool</text>

  <!-- Node i -->
  <circle cx="895" cy="300" r="60" fill="#eaf1fb" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="895" y="289" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">node i</text>
  <text x="895" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0b0b0b">N_i (&#915;) M_i</text>
  <text x="895" y="372" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b6b6b">M_i = g(N_i)</text>
  <text x="895" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">target / synapse pool</text>

  <!-- Axon compartments -->
  <rect x="235" y="268" width="150" height="64" rx="4" fill="#f7f7f5" stroke="#b9b7b0" stroke-width="1.5"/>
  <text x="310" y="298" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0b0b0b">presynaptic</text>
  <text x="310" y="317" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">[0, L1]</text>

  <rect x="385" y="268" width="60" height="64" fill="#f7f7f5" stroke="#b9b7b0" stroke-width="1.5"/>
  <text x="415" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0b0b0b">AIS</text>
  <text x="415" y="253" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">&#955;&#8321; reduces diffusivity</text>
  <line x1="415" y1="257" x2="415" y2="268" stroke="#8a8a8a" stroke-width="1"/>

  <rect x="445" y="268" width="320" height="64" rx="4" fill="#f7f7f5" stroke="#b9b7b0" stroke-width="1.5"/>
  <text x="605" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">axon proper &#8212; active transport</text>
  <text x="605" y="316" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">aggregation &#947;&#8321; &#183; motor-crowding &#948; &#183; velocity-coupling &#949;</text>

  <!-- Distributed source arrows into axon proper -->
  <text x="605" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">distributed source F_edge&#8320;(x)</text>
  <line x1="490" y1="242" x2="490" y2="266" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrowMuted)"/>
  <line x1="560" y1="242" x2="560" y2="266" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrowMuted)"/>
  <line x1="630" y1="242" x2="630" y2="266" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrowMuted)"/>
  <line x1="700" y1="242" x2="700" y2="266" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrowMuted)"/>

  <!-- B callout at x=0 -->
  <text x="235" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6">B = n(0)</text>
  <text x="235" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">(shooting parameter)</text>
  <line x1="235" y1="244" x2="235" y2="265" stroke="#2a78d6" stroke-width="1.75" marker-end="url(#arrowBlue)"/>

  <!-- x=0 and x=L ticks -->
  <line x1="235" y1="332" x2="235" y2="340" stroke="#6b6b6b" stroke-width="1"/>
  <text x="235" y="357" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">x=0</text>
  <line x1="765" y1="332" x2="765" y2="340" stroke="#6b6b6b" stroke-width="1"/>
  <text x="765" y="357" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">x=L</text>

  <!-- Left boundary arrows (x=0): uptake in (red), release out (green) -->
  <text x="200" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b5342f">uptake mu_u_0&#183;N_j</text>
  <line x1="172" y1="270" x2="228" y2="270" stroke="#d64545" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="228" y1="316" x2="172" y2="316" stroke="#2ea043" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="200" y="337" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a7a40">release mu_r_0&#183;B</text>

  <!-- Right boundary arrows (x=L): release out (green), uptake in (red) -->
  <text x="800" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a7a40">release mu_r_L&#183;n(L)</text>
  <line x1="772" y1="270" x2="828" y2="270" stroke="#2ea043" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="828" y1="316" x2="772" y2="316" stroke="#d64545" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="800" y="337" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b5342f">uptake mu_u_L&#183;N_i</text>

  <!-- Shooting / mass-balance condition, plus the quasi-static velocity/aggregation closure -->
  <rect x="120" y="398" width="760" height="92" rx="6" fill="#f3f6fa" stroke="#d8dee6" stroke-width="1"/>
  <text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#0b0b0b">Shooting condition &#8212; B is adjusted so this balances (n(L) follows from B):</text>
  <text x="500" y="445" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0b0b0b">&#8722;mu_r_0&#183;B + mu_u_0&#183;N_j + &#8747;F_edge_0 dx &#8722; mu_r_L&#183;n(L) + mu_u_L&#183;N_i = 0</text>
  <text x="500" y="471" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a4a4a">v(n) = v_a(1+&#948;n)(1&#8722;&#949;m) &#8722; v_r,&#160;&#160;&#160; m = &#947;&#8321;n&#178;/(&#946;&#8722;&#947;&#8322;n)&#160;&#160; [quasi-static closure]</text>

  <!-- Footnote tying to outer node ODE -->
  <text x="500" y="524" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">J&#8320; (at node j) and J_L (at node i) from every edge are summed into each node&#8217;s own mass-balance ODE.</text>

  <!-- Legend -->
  <circle cx="330" cy="556" r="6" fill="#d64545"/>
  <text x="344" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0b0b0b">uptake &#8212; pool &#8594; axon</text>
  <circle cx="580" cy="556" r="6" fill="#2ea043"/>
  <text x="594" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0b0b0b">release &#8212; axon &#8594; pool</text>
  <text x="500" y="582" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6b6b">N = soluble tau monomers &#160;&#160;&#160; M = insoluble tau aggregates</text>

  <!-- Source attribution -->
  <text x="978" y="602" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#9b9b9b">mechanism per Barron et al. 2026 (bioRxiv), Fig. 1 / eqs. 1&#8211;5, mapped to this repo&#8217;s variable names</text>
</svg>
